name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in student.env}
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -D\"$$MYSQL_DATABASE\" -Nse 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    networks: [db-net]
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: ${APP_IMAGE:-devops-final-app}:${APP_TAG:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      STUDENT_NAME: ${STUDENT_NAME}
      STUDENT_ID: ${STUDENT_ID}
      STUDENT_CLASS: ${STUDENT_CLASS}
      TZ: Asia/Ho_Chi_Minh
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/orders"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    networks: [db-net, proxy-net]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${APP_PORT}:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/orders"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [proxy-net]
networks:
  proxy-net:
  db-net:
volumes:
  mysql_data:
